<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eglesson — Notes for every class, every subject</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Free notes, solutions, old questions and quizzes for Nepali students: Class 8, 9, 10, SEE, +2, Engineering, Medical, Management and more.">
  <meta name="theme-color" content="#6C3BFF">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a light flash in dark mode.
    try { var t = localStorage.getItem('eg.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <app-root>
    <div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#6C3BFF;font-weight:700;font-size:22px">eglesson</div>
  </app-root>
</body>
</html>
